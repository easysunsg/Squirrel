version: "3.8"

services:
  backend:
    build: ./server
    container_name: squirrel-backend
    volumes:
      - ./data:/data
      - ./storage:/storage
    environment:
      - SQUIRREL_DATA_DIR=/data
      - SQUIRREL_STORAGE_DIR=/storage
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./squirrel
    container_name: squirrel-frontend
    ports:
      - "5685:80"
    depends_on:
      - backend
    restart: unless-stopped
