version: "3.8"

services:
  squirrel-service:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: squirrel-service
    working_dir: /app
    command: sh -c "cd server && uv sync --frozen || uv sync && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./storage:/app/storage
    environment:
      - SQUIRREL_DATA_DIR=/app/data
      - SQUIRREL_STORAGE_DIR=/app/storage
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
